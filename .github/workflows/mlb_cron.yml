name: B.L.A.S.T. MLB EV Automation

on:
  schedule:
    # Runs every 1 hour for 15 hours during active MLB hours (e.g. from 12pm to 2am EST)
    # Note: Cron is in UTC time. Running 15 times per day to stay within API limits.
    # Season starts March 26 (Tokyo Opening Series), ends October 15
    - cron: '0 16-23,0-6 * 3-10 *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  run-ev-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute MLB Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_KALSHI: ${{ secrets.DISCORD_WEBHOOK_URL_KALSHI }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python run_mlb_pipeline.py
